# ════════════════════════════════════════════════════════════════════
# Configuracion del restaurante cliente — Casa Lola
# ════════════════════════════════════════════════════════════════════
#
# Este fichero centraliza TODO lo especifico de Casa Lola. Para clonar
# el repo a un restaurante nuevo:
#
#   1. Copiar este fichero: cp config/restaurante.example.yaml
#      config/restaurante.yaml
#   2. Editar valores abajo con los del nuevo cliente.
#   3. Crear Supabase nuevo, aplicar migraciones (carpeta supabase/).
#   4. Configurar .env con credenciales propias.
#   5. Desplegar en Railway.
#
# Todo lo que no este aqui (logica del bot, endpoints, tests) se
# mantiene sin cambios.
# ════════════════════════════════════════════════════════════════════

# ─── Datos de contacto y ubicacion ─────────────────────────────────
restaurante:
  nombre: "Casa Lola"
  tipo: "Arroceria y cocina mediterranea"
  ciudad: "Valencia"
  barrio: "Russafa"
  anno_fundacion: 1987
  direccion: "C/ Conde Altea 12, 46005 Valencia"
  telefono: "+34 963 12 34 56"
  email: "reservas@casalola-valencia.es"
  web: "https://casalola-valencia.es"

# ─── Capacidad y reglas de aforo ──────────────────────────────────
capacidad:
  # Aforo total estimado por turno. Fallback informativo: la
  # disponibilidad real la calcula core/mesas.py sobre la tabla `mesas`.
  aforo_max_por_turno: 50
  # A partir de N comensales, NO se reserva directamente: se escala
  # al duenno con motivo "grupo_grande".
  grupo_grande_desde: 17

# ─── Politica de antelacion de reservas ───────────────────────────
# Cada restaurante tiene la suya. Casa Lola acepta reservas hasta el
# ultimo momento y a 1 ano vista. Otros restaurantes mas formales
# pueden requerir 24h antes y solo aceptar 60 dias por delante.
# Pon 0 en cualquier valor para desactivar ese limite.
reservas:
  antelacion_minima_horas: 0       # ej. 2 = "no se reserva con menos de 2h"
  antelacion_maxima_dias: 0        # ej. 90 = "no se reserva con mas de 90 dias"

# ─── Horarios ─────────────────────────────────────────────────────
# Lista de turnos por dia (lista vacia = cerrado).
# Formato: [[apertura, cierre], [apertura, cierre], ...]
horarios:
  lunes:     []
  martes:    [["13:30", "16:00"], ["20:30", "23:30"]]
  miercoles: [["13:30", "16:00"], ["20:30", "23:30"]]
  jueves:    [["13:30", "16:00"], ["20:30", "23:30"]]
  viernes:   [["13:30", "16:00"], ["20:30", "23:30"]]
  sabado:    [["13:30", "16:00"], ["20:30", "23:30"]]
  domingo:   [["13:30", "16:00"]]

# ─── Identidad del bot (OBLIGATORIO si usa cualquier canal IA) ────
# El bot tiene su propia personalidad. Se usa en los 3 canales
# (web, WhatsApp, voz). Sin esto, los prompts caen a "asistente"
# generico.
bot:
  nombre: "Lola"                              # nombre propio del bot
  descripcion: "asistente de Casa Lola"       # 1 linea descriptiva

# ─── Landing publica (OPCIONAL: solo si usa la landing Casa Lola) ──
# Si el cliente NO va a usar la landing entera (ej. solo quiere el
# widget embebido en su web), borra todo este bloque.
landing:
  # Paleta CSS aplicada al landing. Se inyecta como CSS custom
  # properties al cargar.
  colores:
    bg: "#1a1612"
    cream: "#f5ede0"
    accent: "#c84b31"
    gold: "#d4a24c"
    text: "#3a2e26"
  # Textos visibles
  slogan: "Arroces valencianos en el corazon de Russafa"
  tagline: "Desde 1987, en el barrio de Russafa"
  # Imagenes (rutas relativas servidas desde el backend). Si vacias
  # ("") se omiten del <head> sin romper la landing.
  favicon: "/static/branding/favicon.svg"          # tab del navegador
  og_image: ""                                     # 1200x630, sube tu PNG a /static/branding/og-image.png
  logo: ""                                         # logo principal, sube tu PNG/SVG a /static/branding/logo.png

# ─── Widget chat web embebido (OPCIONAL: solo si lo usa) ───────────
# Si el cliente NO embebe el widget (solo WA o voz), borra este bloque.
widget_web:
  avatar_emoji: "👩‍🍳"                          # icono del header del chat
  # Primer mensaje del bot al abrir el chat. Si vacio, usa
  # "Hola, soy el asistente de <restaurante>. ¿En que te ayudo?"
  mensaje_bienvenida: "¡Hola! Soy Lola, asistente de Casa Lola. Puedo reservarte mesa, contarte la carta o darte el horario. ¿En que te ayudo?"
  # Colores especificos del widget. Si vacios, hereda de
  # landing.colores (accent y cream). Util si el cliente embede el
  # widget en una web propia con paleta distinta a la nuestra.
  colores:
    burbuja_bot: "#FFF5E6"
    burbuja_usuario: "#c84b31"
    fondo: "#FFFFFF"

# ─── Notificaciones por email (RECOMENDADO) ────────────────────────
# Branding de los emails que se envian al duenno via Resend.
emails:
  # Remitente. Formato: "Nombre <email@dominio.com>".
  # Si vacio, usa env var RESEND_FROM o fallback "<nombre> <onboarding@resend.dev>".
  # Para cliente real: configurar dominio propio verificado en Resend.
  from_address: ""
  # URL publica del logo para incrustar arriba en el email. Tiene que
  # ser URL ABSOLUTA (https://...) porque los clientes de correo no
  # pueden seguir rutas relativas. Vacio = email sin logo.
  logo_url: ""

# ─── URLs externas ────────────────────────────────────────────────
# Dejarlas vacias ("") si no aplica.
google_review_url: "https://g.page/CasaLolaValencia/review"

# ─── CORS origenes permitidos ─────────────────────────────────────
# Dominios desde los que la landing puede hacer fetch al backend.
# Anadir localhost solo en desarrollo.
cors_origins:
  - "https://casalola-valencia.es"
  - "https://www.casalola-valencia.es"
  - "http://localhost:3000"
  - "http://127.0.0.1:3000"

