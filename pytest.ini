[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Por defecto excluimos los tests marcados con `eval` (issue #12). Esos
# llaman a Claude REAL y gastan tokens. Para correrlos: pytest -m eval
addopts = -v --tb=short -m "not eval"
markers =
    eval: tests que llaman a Claude real (issue #12). Gastan tokens, no corren por defecto.
